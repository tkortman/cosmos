  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const header = document.getElementById('pageHeader');
      const stickyName = document.querySelector('.sticky-page-name');
      if (header && stickyName) {
        const observer = new IntersectionObserver(([entry]) => {
          stickyName.classList.toggle('visible', !entry.isIntersecting);
        }, { rootMargin: `-${getComputedStyle(document.documentElement).getPropertyValue('--nav-height')} 0px 0px 0px` });
        observer.observe(header);
      }
      document.querySelectorAll('.sidebar__section-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!expanded));
          btn.querySelector('.sidebar__chevron').classList.toggle('sidebar__chevron--collapsed', expanded);
          const items = btn.nextElementSibling;
          if (items) items.classList.toggle('sidebar__section-items--hidden', expanded);
        });
      });
    });
  </script>
