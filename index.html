<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cosmos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        body.intro-active { overflow: hidden; height: 100vh; }

        .top-nav {
            transform: translateY(-100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-nav.visible {
            transform: translateY(0);
        }

        .brand-intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .brand-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 10vh;
        }

        .brand-text-container {
            position: relative;
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
        }

        .brand-text-container .word {
            display: inline-flex;
            align-items: baseline;
            opacity: 0;
            transform: translateY(-8px);
        }

        .brand-text-container .letter {
            display: inline-block;
            font-size: 1.8vw;
            font-weight: 500;
            font-family: 'EuclidCircularA', 'Helvetica Neue', Arial, sans-serif;
            color: var(--color-text);
            letter-spacing: 0.02em;
        }

        .brand-text-container .letter.italic {
            font-weight: 400;
            font-style: italic;
        }

        .brand-text-container .space {
            display: inline-block;
            width: 0.6vw;
            opacity: 0;
        }

        .brand-text-container .comma {
            display: inline-block;
            font-size: 1.8vw;
            font-weight: 500;
            font-family: 'EuclidCircularA', 'Helvetica Neue', Arial, sans-serif;
            color: var(--color-text);
        }

        .hero {
            position: relative;
            width: 100%;
            min-height: 65vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.6s ease;
            margin-top: calc(-1 * var(--nav-height));
        }

        .hero.visible {
            opacity: 1;
        }

        .hero__image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero__overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0.1) 100%);
        }

        .hero__content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 80px 24px 0;
        }

        .hero__title {
            font-family: var(--font-display);
            font-size: 72px;
            font-weight: 500;
            line-height: 1.1;
            color: #fff;
            margin-bottom: 24px;
        }

        .hero__subtitle {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.5;
            color: rgba(255,255,255,0.85);
        }

        .bento-grid {
            opacity: 0;
            transition: opacity 0.6s ease;
            max-width: 1600px;
            margin: 60px auto;
        }

        .bento-grid.visible {
            opacity: 1;
        }
    </style>
</head>
<body class="intro-active">
  <header class="top-nav top-nav--transparent">
    <a href="index.html" class="top-nav__brand"><span class="brand-letter">c</span><span class="brand-letter">o</span><span class="brand-letter">s</span><span class="brand-letter">m</span><span class="brand-letter brand-letter--italic">o</span><span class="brand-letter brand-letter--italic">s</span></a>
    <nav class="top-nav__links">
      <a href="index.html" class="active">Overview</a>
      <a href="docs/index.html">Foundations</a>
      <a href="design-system/index.html">Design System</a>
      <a href="cms/index.html">CMS</a>
      <a href="ai/index.html">AI</a>
    </nav>
    <button class="top-nav__theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <div class="brand-intro-overlay" id="brandIntroOverlay">
    <div class="brand-canvas">
      <div class="brand-text-container" id="brandTextContainer"></div>
    </div>
  </div>

  <section class="hero" id="hero">
    <img class="hero__image" src="assets/images/hero.jpg" alt="Shipt delivery moment">
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <h1 class="hero__title">Design for everyday<br>moments and beyond.</h1>
      <p class="hero__subtitle">Quietly making things easier so teams can focus where they're needed most.</p>
    </div>
  </section>

  <section class="bento-grid">
    <a href="docs/index.html" class="bento-card bento-card--sm" style="background:#f0f0f0">
      <span class="bento-card__label">Brand Strategy <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a href="design-system/tokens-typography.html" class="bento-card bento-card--sm" style="background:#e8e8e8">
      <span class="bento-card__label">Typography <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a href="design-system/tokens-colors.html" class="bento-card bento-card--sm" style="background:#f4f4f4">
      <span class="bento-card__label">Color <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a href="docs/visual-identity.html" class="bento-card bento-card--lg" style="background:#dcdcdc">
      <span class="bento-card__label">Photography <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a href="design-system/index.html" class="bento-card bento-card--md" style="background:#ececec">
      <span class="bento-card__label">Components <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <a href="docs/visual-identity.html" class="bento-card bento-card--md" style="background:#f2f2f2">
      <span class="bento-card__label">Logo <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
  </section>

  <script src="intro.js"></script>
</body>
</html>
