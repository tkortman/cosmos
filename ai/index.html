<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cosmos</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <nav class="top-nav__links">
            <a href="../index.html">Overview</a>
            <a href="../docs/index.html">Foundations</a>
            <a href="#">Design System</a>
            <a href="#">CMS</a>
            <a href="index.html" class="active">AI</a>
        </nav>
        <button class="top-nav__theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </header>

    <!-- Brand Intro Animation Overlay -->
    <div class="brand-intro-overlay" id="brandIntroOverlay">
        <div class="brand-canvas">
            <div class="brand-text-container" id="brandTextContainer"></div>
        </div>
    </div>

    <div class="app">
        <!-- Brain Visualization -->
        <div class="brain-container" id="brainContainer">
            <!-- Nodes will be injected by JS -->
            <svg class="connections-svg" id="connectionsSvg"></svg>
        </div>

        <!-- Floating Prompt Bar -->
        <div class="floating-prompt">
            <div class="floating-prompt-inner">
                <div class="prompt-input-wrap">
                    <textarea id="promptInput" rows="1"></textarea>
                    <span class="custom-placeholder" id="customPlaceholder">Ask <em>cosmos</em> anything...</span>
                </div>
                <button id="micBtn" class="prompt-mic-btn" aria-label="Voice input">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 1a2 2 0 0 0-2 2v4a2 2 0 0 0 4 0V3a2 2 0 0 0-2-2Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 7a4 4 0 0 1-8 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 12v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </button>
                <button id="submitPrompt" class="prompt-send-btn" aria-label="Send">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Checkout Wireframe Flows -->
        <div class="wireframe-flows hidden" id="wireframeFlows">
            <button class="wf-close-btn" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Flow 1: Cart -->
            <div class="wireframe-screen">
                <div class="wireframe-header">
                    <div class="wf-bar wf-logo"></div>
                    <div class="wf-bar wf-icon-btn"></div>
                </div>
                <div class="wireframe-body">
                    <div class="wf-bar wf-heading"></div>
                    <div class="wf-bar wf-subtext"></div>
                    <div class="wf-spacer"></div>
                    <!-- Line items -->
                    <div class="wf-line-item">
                        <div class="wf-product-img"></div>
                        <div class="wf-line-item-info">
                            <div class="wf-bar wf-text-md"></div>
                            <div class="wf-bar wf-text-sm"></div>
                            <div class="wf-line-item-bottom">
                                <div class="wf-qty-control">
                                    <div class="wf-qty-btn"></div>
                                    <div class="wf-bar wf-qty-num"></div>
                                    <div class="wf-qty-btn"></div>
                                </div>
                                <div class="wf-bar wf-text-price"></div>
                            </div>
                        </div>
                    </div>
                    <div class="wf-divider"></div>
                    <div class="wf-line-item">
                        <div class="wf-product-img"></div>
                        <div class="wf-line-item-info">
                            <div class="wf-bar wf-text-md"></div>
                            <div class="wf-bar wf-text-sm"></div>
                            <div class="wf-line-item-bottom">
                                <div class="wf-qty-control">
                                    <div class="wf-qty-btn"></div>
                                    <div class="wf-bar wf-qty-num"></div>
                                    <div class="wf-qty-btn"></div>
                                </div>
                                <div class="wf-bar wf-text-price"></div>
                            </div>
                        </div>
                    </div>
                    <div class="wf-divider"></div>
                    <!-- Order summary -->
                    <div class="wf-spacer"></div>
                    <div class="wf-summary-row">
                        <div class="wf-bar wf-text-sm"></div>
                        <div class="wf-bar wf-text-price"></div>
                    </div>
                    <div class="wf-summary-row">
                        <div class="wf-bar wf-text-sm"></div>
                        <div class="wf-bar wf-text-price"></div>
                    </div>
                    <div class="wf-divider"></div>
                    <div class="wf-summary-row">
                        <div class="wf-bar wf-text-md"></div>
                        <div class="wf-bar wf-text-price-lg"></div>
                    </div>
                    <div class="wf-spacer"></div>
                    <div class="wf-btn-primary"></div>
                </div>
                <div class="wireframe-label">Cart</div>
            </div>

            <!-- Flow 2: Checkout -->
            <div class="wireframe-screen">
                <div class="wireframe-header">
                    <div class="wf-bar wf-logo"></div>
                    <div class="wf-steps">
                        <div class="wf-step filled"></div>
                        <div class="wf-step-line filled"></div>
                        <div class="wf-step filled"></div>
                        <div class="wf-step-line"></div>
                        <div class="wf-step"></div>
                    </div>
                </div>
                <div class="wireframe-body">
                    <div class="wf-bar wf-heading"></div>
                    <div class="wf-spacer-sm"></div>
                    <!-- Shipping address -->
                    <div class="wf-bar wf-section-title"></div>
                    <div class="wf-form-row">
                        <div class="wf-form-group half">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                        <div class="wf-form-group half">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                    </div>
                    <div class="wf-form-group">
                        <div class="wf-bar wf-label"></div>
                        <div class="wf-input"></div>
                    </div>
                    <div class="wf-form-row">
                        <div class="wf-form-group half">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                        <div class="wf-form-group third">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                        <div class="wf-form-group third">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                    </div>
                    <div class="wf-spacer"></div>
                    <!-- Payment -->
                    <div class="wf-bar wf-section-title"></div>
                    <div class="wf-form-group">
                        <div class="wf-bar wf-label"></div>
                        <div class="wf-input"></div>
                    </div>
                    <div class="wf-form-row">
                        <div class="wf-form-group half">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                        <div class="wf-form-group half">
                            <div class="wf-bar wf-label"></div>
                            <div class="wf-input"></div>
                        </div>
                    </div>
                    <div class="wf-spacer"></div>
                    <div class="wf-btn-primary"></div>
                </div>
                <div class="wireframe-label">Checkout</div>
            </div>

            <!-- Flow 3: Order Confirmation -->
            <div class="wireframe-screen">
                <div class="wireframe-header">
                    <div class="wf-bar wf-logo"></div>
                    <div class="wf-steps">
                        <div class="wf-step filled"></div>
                        <div class="wf-step-line filled"></div>
                        <div class="wf-step filled"></div>
                        <div class="wf-step-line filled"></div>
                        <div class="wf-step filled"></div>
                    </div>
                </div>
                <div class="wireframe-body wf-confirmation">
                    <div class="wf-check-circle"></div>
                    <div class="wf-bar wf-heading wf-centered"></div>
                    <div class="wf-bar wf-subtext wf-centered"></div>
                    <div class="wf-spacer"></div>
                    <!-- Order details card -->
                    <div class="wf-card">
                        <div class="wf-bar wf-section-title"></div>
                        <div class="wf-spacer-sm"></div>
                        <div class="wf-summary-row">
                            <div class="wf-bar wf-text-sm"></div>
                            <div class="wf-bar wf-text-sm"></div>
                        </div>
                        <div class="wf-summary-row">
                            <div class="wf-bar wf-text-sm"></div>
                            <div class="wf-bar wf-text-sm"></div>
                        </div>
                        <div class="wf-summary-row">
                            <div class="wf-bar wf-text-sm"></div>
                            <div class="wf-bar wf-text-sm"></div>
                        </div>
                        <div class="wf-divider"></div>
                        <div class="wf-summary-row">
                            <div class="wf-bar wf-text-md"></div>
                            <div class="wf-bar wf-text-price-lg"></div>
                        </div>
                    </div>
                    <div class="wf-spacer"></div>
                    <!-- Shipping info -->
                    <div class="wf-card">
                        <div class="wf-bar wf-section-title"></div>
                        <div class="wf-spacer-sm"></div>
                        <div class="wf-bar wf-text-md"></div>
                        <div class="wf-bar wf-text-sm"></div>
                        <div class="wf-bar wf-text-sm"></div>
                    </div>
                    <div class="wf-spacer"></div>
                    <div class="wf-btn-outline"></div>
                </div>
                <div class="wireframe-label">Order Confirmation</div>
            </div>
        </div>

        <!-- Slides Wireframe Flows -->
        <div class="wireframe-flows hidden" id="slidesWireframeFlows">
            <button class="wf-close-btn" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Slide 1: Title Slide -->
            <div class="wireframe-screen wf-landscape">
                <div class="wireframe-header wf-slides-header">
                    <div class="wf-bar wf-logo"></div>
                    <div class="wf-slides-toolbar">
                        <div class="wf-bar wf-toolbar-btn"></div>
                        <div class="wf-bar wf-toolbar-btn"></div>
                        <div class="wf-bar wf-toolbar-btn"></div>
                    </div>
                </div>
                <div class="wf-slides-canvas">
                    <div class="wf-slide">
                        <div class="wf-slide-content wf-slide-title-layout">
                            <div class="wf-bar wf-slide-heading"></div>
                            <div class="wf-bar wf-slide-subheading"></div>
                        </div>
                    </div>
                </div>
                <div class="wf-slides-filmstrip">
                    <div class="wf-filmstrip-thumb active"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                </div>
                <div class="wireframe-label">Title Slide</div>
            </div>

            <!-- Slide 2: Content Slide -->
            <div class="wireframe-screen wf-landscape">
                <div class="wireframe-header wf-slides-header">
                    <div class="wf-bar wf-logo"></div>
                    <div class="wf-slides-toolbar">
                        <div class="wf-bar wf-toolbar-btn"></div>
                        <div class="wf-bar wf-toolbar-btn"></div>
                        <div class="wf-bar wf-toolbar-btn"></div>
                    </div>
                </div>
                <div class="wf-slides-canvas">
                    <div class="wf-slide">
                        <div class="wf-slide-content wf-slide-content-layout">
                            <div class="wf-bar wf-slide-section-title"></div>
                            <div class="wf-slide-two-col">
                                <div class="wf-slide-col">
                                    <div class="wf-slide-img-placeholder"></div>
                                </div>
                                <div class="wf-slide-col">
                                    <div class="wf-bar wf-slide-text-lg"></div>
                                    <div class="wf-bar wf-slide-text-md"></div>
                                    <div class="wf-bar wf-slide-text-md"></div>
                                    <div class="wf-bar wf-slide-text-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="wf-slides-filmstrip">
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb active"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                </div>
                <div class="wireframe-label">Content</div>
            </div>

            <!-- Slide 3: Data/Chart Slide -->
            <div class="wireframe-screen wf-landscape">
                <div class="wireframe-header wf-slides-header">
                    <div class="wf-bar wf-logo"></div>
                    <div class="wf-slides-toolbar">
                        <div class="wf-bar wf-toolbar-btn"></div>
                        <div class="wf-bar wf-toolbar-btn"></div>
                        <div class="wf-bar wf-toolbar-btn"></div>
                    </div>
                </div>
                <div class="wf-slides-canvas">
                    <div class="wf-slide">
                        <div class="wf-slide-content wf-slide-content-layout">
                            <div class="wf-bar wf-slide-section-title"></div>
                            <div class="wf-slide-chart">
                                <div class="wf-chart-bar" style="height: 40%"></div>
                                <div class="wf-chart-bar" style="height: 65%"></div>
                                <div class="wf-chart-bar" style="height: 85%"></div>
                                <div class="wf-chart-bar" style="height: 55%"></div>
                                <div class="wf-chart-bar" style="height: 70%"></div>
                            </div>
                            <div class="wf-slide-chart-labels">
                                <div class="wf-bar wf-chart-label"></div>
                                <div class="wf-bar wf-chart-label"></div>
                                <div class="wf-bar wf-chart-label"></div>
                                <div class="wf-bar wf-chart-label"></div>
                                <div class="wf-bar wf-chart-label"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="wf-slides-filmstrip">
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb active"></div>
                    <div class="wf-filmstrip-thumb"></div>
                    <div class="wf-filmstrip-thumb"></div>
                </div>
                <div class="wireframe-label">Data</div>
            </div>
        </div>
    </div>

    <script src="brain.js"></script>
</body>
</html>
